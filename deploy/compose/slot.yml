services:
  api:
    image: __APP_IMAGE__
    container_name: synapse-app-__APP_SLOT__
    restart: always
    env_file: /opt/synapse/shared/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
      RAG_PORT: ${RAG_PORT:-8000}
      RAG_API_URL: http://rag_api:${RAG_PORT:-8000}
      ADMIN_PANEL_URL: https://${ADMIN_DOMAIN}
    ports:
      - "127.0.0.1:__APP_PORT__:3080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/synapse/shared/librechat.yaml:/app/librechat.yaml:ro
      - /opt/synapse/shared/images:/app/client/public/images
      - /opt/synapse/shared/uploads:/app/uploads
      - /opt/synapse/shared/logs:/app/api/logs
      - /opt/synapse/shared/skill:/app/skill
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
