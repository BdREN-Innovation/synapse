upstream synapse {
    server 127.0.0.1:3080;
    keepalive 64;
}

server {
    server_name chat.bdren.ai;
    client_max_body_size 100M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Admin console, served under a sub-path so it needs no extra DNS record
    # or certificate. Authentication and capability checks are enforced by the
    # LibreChat API it calls, not by nginx.
    location /adminpanel {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://synapse;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/chat.bdren.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chat.bdren.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = chat.bdren.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name chat.bdren.ai;

    listen 80;
    return 404; # managed by Certbot


}