version: 1.3.13
cache: true

interface:
  customWelcome: 'Welcome to BdREN Synapse. Ask me to draft, analyze, or convert your documents.'
  privacyPolicy:
    externalUrl: 'https://www.bdren.net.bd/privacy'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://www.bdren.net.bd/terms'
    openNewTab: true
  # Hide features noob office users do not need (trim to taste):
  prompts: true
  bookmarks: true
  multiConvo: false
  agents: true

registration:
  socialLogins: []
  # allowedDomains:              # optional: restrict signup to member universities
  #   - 'bdren.net.bd'
  #   - 'gub.edu.bd'

endpoints:
  agents:
    capabilities:
      - 'execute_code'
      - 'file_search'
      - 'artifacts'
      - 'skills'
      - 'tools'
      - 'ocr'
      - 'context'

  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default: ['z-ai/glm-4.7', 'openai/gpt-5-mini']
        fetch: false            # pin models; fetch:true lists hundreds and confuses novices
      titleConvo: true
      titleModel: 'z-ai/glm-4.7'
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'
modelSpecs:
  # Users land on the document-capable agent instead of a bare model, so code
  # execution is available without anyone having to enable it per conversation.
  enforce: false
  prioritize: true
  list:
    - name: "document-assistant"
      label: "Document Assistant"
      description: "Creates real Word, Excel, PowerPoint and PDF files"
      default: true
      preset:
        endpoint: "agents"
        agent_id: "agent_G0NWGg_xHC69EBHc8x9ob"
