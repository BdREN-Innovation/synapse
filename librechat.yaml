version: 1.3.13
cache: true

interface:
  customWelcome: 'Welcome to BdREN Synapse. Ask me to draft, analyze, or convert your documents.'
  privacyPolicy:
    externalUrl: 'https://www.bdren.net.bd/privacy'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://www.bdren.net.bd/terms'
    openNewTab: true
  # Hide features noob office users do not need (trim to taste):
  prompts: true
  bookmarks: true
  multiConvo: false
  agents: true

registration:
  socialLogins: []
  # allowedDomains:              # optional: restrict signup to member universities
  #   - 'bdren.net.bd'
  #   - 'gub.edu.bd'

endpoints:
  agents:
    capabilities:
      - 'execute_code'
      - 'file_search'
      - 'artifacts'
      - 'skills'
      - 'tools'
      - 'ocr'
      - 'context'

  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default:
          - 'moonshotai/kimi-k2.6'
          - 'google/gemini-3.1-flash-image'   # "Nano Banana 2"; returns images as well as text
        fetch: false            # pin models; fetch:true lists hundreds and confuses novices
      titleConvo: true
      titleModel: 'moonshotai/kimi-k2.6'
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'

    - name: 'NVIDIA'
      apiKey: '${NVIDIA_API_KEY}'
      baseURL: 'https://integrate.api.nvidia.com/v1'
      models:
        default: ['z-ai/glm-5.2']
        fetch: false
      titleConvo: true
      titleModel: 'z-ai/glm-5.2'
      addParams:
        # camelCase is required — an unrecognised `max_tokens` is passed through as a
        # raw model kwarg instead of setting the limit. Temperature and top_p are left
        # out deliberately: the UI already defaults both to 1, and listing them here
        # would pin the sliders rather than seed them.
        maxTokens: 16384
      dropParams: ['stop']
      modelDisplayLabel: 'NVIDIA'
