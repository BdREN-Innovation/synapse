# Local configuration aligned with the enabled endpoints and models in `.env`.
# Keep credentials and deployment secrets in `.env`; this file contains only
# non-secret UI/model configuration.
version: 1.3.13

cache: true

interface:
  customWelcome: 'Welcome to LibreChat!'
  fileSearch: true
  modelSelect: true
  parameters: true
  presets: true
  prompts:
    use: true
    create: true
    share: false
    public: false
  bookmarks: true
  multiConvo: true
  agents:
    use: true
    create: true
    share: false
    public: false
  marketplace:
    use: false
  fileCitations: true

registration:
  socialLogins: []


modelSpecs:
  list:
    - name: gpt-5.6-luna
      label: GPT-5.6 Luna
      default: true
      askUserQuestion: true
      preset:
        endpoint: OpenAI
        model: gpt-5.6-luna
        promptPrefix: |
          You assist non-technical office users with emails, letters, reports,
          research, document editing, meeting materials, and presentations.

          Before answering, check whether an important detail is missing. When
          it is, ask a short plain-language follow-up question with 2–4 options.
          Allow the user to provide another answer and ask no more than three
          clarification questions for one request.
          Do not ask for passwords, payment information, or other unnecessary
          sensitive data. Do not ask for greetings or simple factual questions.

    - name: gpt-4.1
      label: GPT-4.1
      askUserQuestion: true
      preset:
        endpoint: OpenAI
        model: gpt-4.1
        promptPrefix: |
          You assist non-technical office users with emails, letters, reports,
          research, document editing, meeting materials, and presentations.

          Before answering, check whether an important detail is missing. When
          it is, ask a short plain-language follow-up question with 2–4 options.
          Allow the user to provide another answer and ask no more than three
          clarification questions for one request.
          Do not ask for passwords, payment information, or other unnecessary
          sensitive data. Do not ask for greetings or simple factual questions.

    - name: gpt-4o-mini
      label: GPT-4o Mini
      askUserQuestion: true
      preset:
        endpoint: OpenAI
        model: gpt-4o-mini
        promptPrefix: |
          You assist non-technical office users with emails, letters, reports,
          research, document editing, meeting materials, and presentations.

          Before answering, check whether an important detail is missing. When
          it is, ask a short plain-language follow-up question with 2–4 options.
          Allow the user to provide another answer and ask no more than three
          clarification questions for one request.
          Do not ask for passwords, payment information, or other unnecessary
          sensitive data. Do not ask for greetings or simple factual questions.

    - name: claude-sonnet-4-5
      label: Claude Sonnet 4.5
      askUserQuestion: true
      preset:
        endpoint: Claude
        model: claude-sonnet-4-5

    - name: claude-haiku-4-5
      label: Claude Haiku 4.5
      askUserQuestion: true
      preset:
        endpoint: Claude
        model: claude-haiku-4-5
        promptPrefix: |
          You assist non-technical office users with emails, letters, reports,
          research, document editing, meeting materials, and presentations.

          Before answering, check whether an important detail is missing. When
          it is, ask a short plain-language follow-up question with 2–4 options.
          Allow the user to provide another answer and ask no more than three
          clarification questions for one request.
          Do not ask for passwords, payment information, or other unnecessary
          sensitive data. Do not ask for greetings or simple factual questions.

    - name: moonshotai-kimi-k2-6
      label: Kimi K2.6
      askUserQuestion: true
      preset:
        endpoint: OpenRouter
        model: moonshotai/kimi-k2.6

    - name: z-ai-glm-5-2
      label: GLM 5.2
      askUserQuestion: true
      preset:
        endpoint: NVIDIA
        model: z-ai/glm-5.2

endpoints:
  custom:
    - name: OpenAI
      apiKey: '${OPENAI_API_KEY}'
      baseURL: 'https://api.openai.com/v1'
      models:
        default:
          - 'gpt-5.6-luna'
          - 'gpt-4.1'
          - 'gpt-4o-mini'
        fetch: false
      modelDisplayLabel: OpenAI

    - name: Claude
      provider: anthropic
      apiKey: '${ANTHROPIC_API_KEY}'
      baseURL: 'https://api.anthropic.com'
      models:
        default:
          - 'claude-sonnet-4-5'
          - 'claude-haiku-4-5'
        fetch: false
      modelDisplayLabel: Claude


    - name: OpenRouter
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
        x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        default:
            - 'moonshotai/kimi-k2.6'
            - 'google/gemini-3.1-flash-image'
        fetch: false
      titleConvo: true
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'


    - name: NVIDIA
      apiKey: '${NVIDIA_API_KEY}'
      baseURL: 'https://integrate.api.nvidia.com/v1'
      models:
        default:
            - 'z-ai/glm-5.2'
        fetch: false
      titleConvo: true
      dropParams: ['stop']
      modelDisplayLabel: 'NVIDIA'
