name: Docker Candidate Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: 'Existing candidate image SHA (blank = recorded previous candidate)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docker-candidate-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, synapse-candidate]
    environment: candidate
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Synchronize deployment assets
        run: sudo /home/bdren/synapse/bin/sync "$GITHUB_WORKSPACE"
      - name: Build and deploy Docker candidate
        if: github.event_name == 'push'
        run: sudo /home/bdren/synapse/bin/deploy "${{ github.sha }}" "$GITHUB_WORKSPACE"
      - name: Roll back to selected candidate
        if: github.event_name == 'workflow_dispatch'
        run: sudo /home/bdren/synapse/bin/rollback "${{ inputs.rollback_sha }}"
      - name: Show deployment state
        if: always()
        run: sudo /home/bdren/synapse/bin/status
